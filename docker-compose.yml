services:
  postgres:
    image: postgres:16-alpine
    container_name: grossbit-postgres
    restart: always
    environment:
      POSTGRES_USER: grossbit
      POSTGRES_PASSWORD: grossbit_secret
      POSTGRES_DB: grossbit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/01_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grossbit -d grossbit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
