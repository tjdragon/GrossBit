[package]
name = "grossbit"
version = "0.1.0"
edition = "2021"
description = "A Bitcoin library for testnet with UTXO reservation, transaction building/parsing, RPC client, and address indexing."
license = "MIT OR Apache-2.0"

[dependencies]
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json"] }
parking_lot = "0.12"
tracing = "0.1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
